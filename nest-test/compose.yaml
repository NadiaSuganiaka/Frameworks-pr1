services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: nest
      POSTGRES_DB: nest_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nest -d nest_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
